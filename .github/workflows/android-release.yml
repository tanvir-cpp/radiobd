name: Build & Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release tag (e.g. v1.0.1)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "791244269256e081a9648b4996b7f38028b97940" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
          for sdk in $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$sdk" ]; then
              yes | "$sdk" --licenses || true
              break
            fi
          done

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Next.js Static Export
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset
        id: prepare-apk
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ github.event.inputs.version_tag || 'v1.0.0' }}"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/RadioBD-${TAG}.apk
          echo "APK_PATH=release-assets/RadioBD-${TAG}.apk" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RadioBD-Android-APK
          path: ${{ steps.prepare-apk.outputs.APK_PATH }}
          retention-days: 14

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.prepare-apk.outputs.TAG }}
          name: Radio BD ${{ steps.prepare-apk.outputs.TAG }}
          body: |
            ## 📻 Radio BD - Live Bangladeshi FM & Betar Radio
            
            ### 🚀 What's New in ${{ steps.prepare-apk.outputs.TAG }}
            - Complete directory of 21 verified Bangladeshi radio stations.
            - HLS (.m3u8), MP3, and AAC live audio streaming engine.
            - Mobile-first aesthetic with full-screen player, spinning vinyl disc, and audio spectrum visualizer.
            - Background playback, safe-area support, and in-app auto updates.
            
            ### 📲 Download & Installation
            Download the `RadioBD-${{ steps.prepare-apk.outputs.TAG }}.apk` file below and open it on your Android device to install or update the app.
          files: ${{ steps.prepare-apk.outputs.APK_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
